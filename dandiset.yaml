description: We are sharing electrophysiology datasets from 4 rats' brains, with the
  injection of Amphetamine (AMPH) or Saline (control group). We found evoked responses
  in both local field potentials and single-unit spike activity after drug administration.
  This dataset is used for our publication (Stabilized Carbon Coating for Scalable
  and Interoperable Neurotransmitter Sensing) in Nature Communications. Data were
  recorded with Intan RHD recorder.
